# Builds and publishes split and universal APKs when a matching version tag is pushed
# or when triggered manually from the GitHub Actions tab.
#
# Recommended for consistent updates without reinstalling:
# Add KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD
# under GitHub Settings → Secrets and variables → Actions.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version against pubspec.yaml
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "::error::Tag v$tag doesn't match pubspec.yaml's version $version"
              exit 1
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Validate bundled scanner CIDRs
        working-directory: scanner
        run: go run ./cmd/normalize_scanner_cidrs --check ../assets/scanner

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Psiphon exit (built from source with the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_psiphon.sh

      - name: Tor and lyrebird (Tor Project's expert bundles, hash-checked)
        run: bash scripts/fetch_tor.sh

      - name: Xray core (built from xray/ with gomobile and the NDK)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
        run: bash scripts/build_xray.sh

      - name: Free Go build cache before APK packaging
        run: |
          go clean -cache -modcache
          df -h /

      - name: Routing data (Chocolate4U/Iran-v2ray-rules, latest)
        run: bash scripts/fetch_geo.sh

      - name: Minify worker
        working-directory: worker
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run minify

      - name: Tor bridges for the setup wizard (fresh each build)
        run: bash scripts/fetch_tor_bridges.sh

      - run: flutter pub get --enforce-lockfile

      - run: flutter test --no-pub

      - name: Build & Sign release APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p android/keystore
          cleanup() {
            rm -f android/key.properties android/keystore/release.jks
          }
          trap cleanup EXIT

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/keystore/release.jks
            keytool -list -keystore android/keystore/release.jks \
              -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          else
            echo "::notice::Generating clean RSA-2048 release signing key (add KEYSTORE_* secrets for a persistent key across updates)."
            KEYSTORE_PASSWORD="MiliConfigReleaseKey2026"
            KEY_ALIAS="miliconfig"
            KEY_PASSWORD="MiliConfigReleaseKey2026"
            keytool -genkeypair -v -noprompt \
              -keystore android/keystore/release.jks \
              -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$KEY_ALIAS" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=MiliConfig, OU=MiliNet, O=MiliConfig, L=Tehran, ST=Tehran, C=IR"
          fi

          {
            printf 'storeFile=../keystore/release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > android/key.properties

          mkdir -p dist
          flutter build apk --release --split-per-abi --no-pub
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            if [ ! -s "$apk" ]; then
              echo "::error::Expected APK was not created: $apk"
              exit 1
            fi
            cp "$apk" "dist/miliconfig-$VERSION-$abi.apk"
          done

          flutter build apk --release --no-pub
          apk="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$apk" ]; then
            echo "::error::Expected universal APK was not created: $apk"
            exit 1
          fi
          cp "$apk" "dist/miliconfig-$VERSION-universal.apk"

      - name: Generate APK SHA-256 checksums
        run: sha256sum dist/miliconfig-*.apk > dist/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: MiliConfig ${{ env.VERSION }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.apk
            dist/SHA256SUMS
